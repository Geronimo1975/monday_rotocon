name: Weekly Machine Report

on:
  schedule:
    # GitHub cron is UTC with no DST. 08:00 Europe/Berlin is 06:00 UTC in
    # summer (CEST) and 07:00 UTC in winter (CET). We fire at both times; the
    # "gate" job below lets only the run that is actually 08:00 in Berlin proceed.
    - cron: "0 6 * * 1"
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
        run: |
          # Pick the single trigger that corresponds to 08:00 Europe/Berlin,
          # based on WHICH cron fired (github.event.schedule) and the current
          # DST offset (+0200 = CEST/summer, +0100 = CET/winter). We deliberately
          # do NOT test the current Berlin hour: GitHub frequently delays
          # scheduled runs by 30-90+ min, which would push the hour past 08 and
          # silently drop the report. The cron-vs-offset match is delay-proof and
          # still proceeds exactly once per Monday (only one offset is ever active).
          OFFSET="$(TZ=Europe/Berlin date +%z)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCHED" = "0 6 * * 1" ] && [ "$OFFSET" = "+0200" ]; then
            echo "Summer (CEST): 06:00 UTC = 08:00 Berlin — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCHED" = "0 7 * * 1" ] && [ "$OFFSET" = "+0100" ]; then
            echo "Winter (CET): 07:00 UTC = 08:00 Berlin — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Trigger '$SCHED' at offset $OFFSET is not the 08:00-Berlin slot — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  send-report:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies (with report extra)
        run: uv sync --extra report

      - name: Send weekly report
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
        run: uv run python scripts/weekly_machine_report.py
