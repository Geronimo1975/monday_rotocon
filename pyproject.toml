[project]
name = "monday-rotocon"
version = "0.2.1"
description = "Typed monday.com client + dashboard export CLI for ROTOCON Europe GmbH"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "George Sebastian Cucuiet", email = "george@rotocon.world" }]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
monday = "monday_rotocon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monday_rotocon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: tests that hit the real monday.com API or n8n webhook (opt-in)",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["monday_rotocon", "scripts"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/monday_rotocon"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["respx.*", "tests.*"]
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "N802"]
